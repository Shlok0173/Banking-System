spring:
  application:
    name: Api-gateway
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          routes:


            # Account Service Route
              -id: account-service
              uri:  http://localhost:8081
              predicates:
               - Path=/api/v1/account/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                - name: StripPrefix
                  args:
                    parts: 3


           #Transaction Service Route
              -id: transaction-service
              uri:  http://localhost:8082
              predicates:
               - Path=/api/v1/transaction/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                - name: StripPrefix
                  args:
                    parts: 3



           #Payment service routes

              -id: payment-service
              uri:  http://localhost:8083
              predicates:
               -Path= /api/v1/payment/**
              filters:
                  - name: RequestRateLimiter
                    args:
                        redis-rate-limiter.replenishRate: 10
                        redis-rate-limiter.burstCapacity: 20

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health,info,gateway