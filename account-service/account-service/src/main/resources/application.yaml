
spring:
  application:
    name: account-service

  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3307/banking_db
    username: root
    password: ${MYSQL_ROOT_PASSWORD:LocalRoot123!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092

    # Consumer Configuration
    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.banking.account.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap

    # Producer Configuration
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true

    # Listener Configuration
    listener:
      ack-mode: manual

server:
  port: 8081
  shutdown: graceful

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,threaddump

  endpoint:
    health:
      show-details: when_authorized

  health:
    defaults:
      enabled: true

# Application Logging
logging:
  level:
    root: INFO
    com.banking.account: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: INFO
